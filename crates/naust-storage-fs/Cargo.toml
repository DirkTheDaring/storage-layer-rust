[package]
name = "naust-storage-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Descriptor-relative filesystem storage adapter"

[dependencies]
async-trait.workspace = true
bytes.workspace = true
libc.workspace = true
naust-storage-core.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "fs", "sync"] }

[features]
fault-injection = []

[dev-dependencies]
naust-storage-core = { workspace = true, features = ["contract-tests"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "io-util", "rt-multi-thread", "sync", "time"] }
