[package]
name = "naust-storage-s3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "S3 object-store adapter for the backend-neutral storage-core contract"

[dependencies]
async-trait.workspace = true
aws-sdk-s3.workspace = true
bytes.workspace = true
naust-storage-core.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false }

[features]
mock-client = []

[dev-dependencies]
naust-storage-core = { workspace = true, features = ["contract-tests"] }
naust-storage-s3 = { path = ".", features = ["mock-client"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
