[package]
name = "storage-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Domain-free core storage contracts and primitives"

[dependencies]
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
tokio = { version = "1", default-features = false }

[features]
# Reusable backend contract-test suite plus its in-memory MODEL store. The
# model is test scaffolding only — it is feature-gated precisely so it can
# never become a hidden third production backend. Adapter crates enable this
# feature from their dev-dependencies to run the same suite against their
# real implementations.
contract-tests = []

[[test]]
name = "contract_suite"
required-features = ["contract-tests"]

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
